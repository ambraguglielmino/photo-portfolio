    body {
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 40px 20px;
      background-color: #0f0f11;
      color: #f0f0f0;
      text-align: center;
      -webkit-font-smoothing: antialiased;
    }
    h1 {
      font-weight: 300;
      letter-spacing: 3px;
      margin-bottom: 6px;
      font-size: 2.2rem;
    }
    .subtitle {
      color: #888;
      font-size: 1.1rem;
      font-weight: 300;
      letter-spacing: 1px;
      margin-top: 0;
      margin-bottom: 20px;
    }
    .contacts {
      margin-bottom: 40px;
      font-size: 0.95rem;
      color: #ccc;
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }
    .contacts a {
      color: #fff;
      text-decoration: none;
      border-bottom: 1px solid #555;
      padding-bottom: 2px;
      transition: border-color 0.3s ease;
    }
    .contacts a:hover {
      border-color: #fff;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
      max-width: 1400px;
      margin: 0 auto;
    }
    .gallery img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.3s ease;
    }
    .gallery img:hover {
      transform: scale(1.02);
    }
    .lightbox {
      display: none;
      position: fixed;
      z-index: 1000;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.9);
      justify-content: center;
      align-items: center;
    }
    .lightbox img {
      max-width: 90%;
      max-height: 90%;
      border-radius: 4px;
      box-shadow: 0 0 20px rgba(0,0,0,0.8);
    }
    .lightbox .close {
      position: absolute;
      top: 20px;
      right: 30px;
      color: #fff;
      font-size: 40px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>

  <script>
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');

    document.querySelectorAll('.gallery img').forEach(image => {
      image.addEventListener('click', () => {
        lightboxImg.src = image.src;
        lightbox.style.display = 'flex';
      });
    });

    function closeLightbox() {
      lightbox.style.display = 'none';
    }
